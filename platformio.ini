; ============================================================================
;  ESP32 智能开关 (ESP32 Relay AC X1 v1.1 / ESP32-WROOM-32E)
;  PlatformIO 工程配置
; ============================================================================

[platformio]
name = esp32-smart-switch
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32@^6.13.0
board     = esp32dev
framework = arduino

; ---- 串口 ----
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

; ---- 分区表：1.9MB × 2 应用分区，满足 双OTA + WiFi ----
board_build.partitions = min_spiffs.csv
board_build.f_cpu      = 240000000L
board_build.f_flash     = 80000000L
board_build.flash_mode  = dio

; ---- 编译选项 ----
build_flags =
    -DFW_VERSION=\"1.2.0\"
    -DFW_BUILD_TIME=\"$UNIX_TIME\"
    -DCORE_DEBUG_LEVEL=1                 ; 0=无 1=错误 2=警告 3=信息
    -DMQTT_MAX_PACKET_SIZE=1024          ; PubSubClient 缓冲区
    -DMQTT_KEEPALIVE=60
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=1
    -Wall

build_unflags =
    -Werror=all

; ---- 依赖库 ----
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    knolleary/PubSubClient@^2.8

lib_ldf_mode = deep+

; ---- 构建前自动把 web/ 目录打包成 gzip 资源头文件 ----
extra_scripts = pre:tools/build_web.py
